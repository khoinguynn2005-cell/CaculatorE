<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10131d">
    <title>Calculator | Máy tính</title>
    <link rel="stylesheet" th:href="@{/css/calculator.css}">
</head>
<body>
<main class="page-shell">
    <section class="calculator" aria-label="Máy tính">
        <header class="calculator-header">
            <div>
                <p class="eyebrow">CALCULATOR</p>
                <h1>Máy tính</h1>
            </div>
            <span class="status-dot" aria-label="Sẵn sàng"></span>
        </header>

        <div class="display" aria-live="polite" aria-atomic="true">
            <p class="expression" id="expression">&nbsp;</p>
            <p class="display-value" id="display" aria-label="Kết quả">0</p>
            <p class="error-message" id="error" role="alert"></p>
        </div>

        <div class="keypad" aria-label="Bàn phím máy tính">
            <button class="key key-utility" data-action="clear" type="button">AC</button>
            <button class="key key-utility" data-action="sign" type="button" aria-label="Đổi dấu">+/−</button>
            <button class="key key-utility" data-action="percent" type="button">%</button>
            <button class="key key-operator" data-operation="divide" type="button" aria-label="Chia">÷</button>

            <button class="key" data-digit="7" type="button">7</button>
            <button class="key" data-digit="8" type="button">8</button>
            <button class="key" data-digit="9" type="button">9</button>
            <button class="key key-operator" data-operation="multiply" type="button" aria-label="Nhân">×</button>

            <button class="key" data-digit="4" type="button">4</button>
            <button class="key" data-digit="5" type="button">5</button>
            <button class="key" data-digit="6" type="button">6</button>
            <button class="key key-operator" data-operation="subtract" type="button" aria-label="Trừ">−</button>

            <button class="key" data-digit="1" type="button">1</button>
            <button class="key" data-digit="2" type="button">2</button>
            <button class="key" data-digit="3" type="button">3</button>
            <button class="key key-operator" data-operation="add" type="button" aria-label="Cộng">+</button>

            <button class="key key-zero" data-digit="0" type="button">0</button>
            <button class="key" data-action="decimal" type="button">.</button>
            <button class="key key-equals" data-action="equals" type="button" aria-label="Bằng">=</button>
        </div>

        <footer class="calculator-footer">Dùng bàn phím để nhập phép tính</footer>
    </section>
</main>
<script th:src="@{/js/calculator.js}" defer></script>
</body>
</html>
